enum Role {
    ADMIN
    USER
}
directive @hasRole(role: Role!) on FIELD_DEFINITION

schema {
    query: RootQuery
    mutation: RootMutation
}

type RootMutation {
    # tags can only be created, changed, archived and removed by admins, they can be used by everyone
    createTag(key: String!, color: String!): TagDefinition @hasRole(role: ADMIN)
    updateTag(key: String!, newKey: String, color: String!): TagDefinition @hasRole(role: ADMIN)
    # an archived tag cannot be used for new time spans, the existing time spans keep it
    archiveTag(key: String!, archived: Boolean!): TagDefinition @hasRole(role: ADMIN)
    # only tags which are not used by any time span can be removed
    removeTag(key: String!): TagDefinition @hasRole(role: ADMIN)

    createUser(name: String!, pass: String!, admin: Boolean!): User @hasRole(role: ADMIN)
    removeUser(id: Int!): User @hasRole(role: ADMIN)
    updateUser(id: Int!, name: String!, pass: String, admin: Boolean!): User @hasRole(role: ADMIN)

    login(username: String!, pass: String!, deviceName: String!, type: DeviceType!, cookie: Boolean!): Login

    createDevice(name: String!, type: DeviceType!): Login @hasRole(role: USER)
    updateDevice(id: Int!, name: String!, type: DeviceType!): Device @hasRole(role: USER)
    removeDevice(id: Int!): Device @hasRole(role: USER)
    removeCurrentDevice: Device! @hasRole(role: USER)

    createTimeSpan(start: Time!, end: Time, tags: [InputTimeSpanTag!], note: String!): TimeSpan @hasRole(role: USER)
    updateTimeSpan(id: Int!, start: Time!, end: Time, tags: [InputTimeSpanTag!], oldStart: Time, note: String!): TimeSpan @hasRole(role: USER)
    removeTimeSpan(id: Int!): TimeSpan @hasRole(role: USER)
    replaceTimeSpanTags(from: InputTimeSpanTag!, to: InputTimeSpanTag!, opt: InputReplaceOptions!): Boolean @hasRole(role: USER)
    copyTimeSpan(id: Int!, start: Time!, end: Time): TimeSpan @hasRole(role: USER)
    stopTimeSpan(id: Int!, end: Time!): TimeSpan @hasRole(role: USER)
    # Imports the rows which are ok (see checkImport), all or nothing.
    importTimeSpans(rows: [InputImportRow!]!, createTags: [String!], updates: [InputImportUpdate!]): ImportResult! @hasRole(role: USER)

    createDashboard(name: String!): Dashboard! @hasRole(role: USER)
    updateDashboard(id: Int!, name: String!): Dashboard! @hasRole(role: USER)
    removeDashboard(id: Int!): Dashboard! @hasRole(role: USER)

    addDashboardRange(dashboardId: Int!, range: InputNamedDateRange!): NamedDateRange @hasRole(role: USER)
    updateDashboardRange(rangeId: Int!, range: InputNamedDateRange!): NamedDateRange @hasRole(role: USER)
    removeDashboardRange(rangeId: Int!): NamedDateRange @hasRole(role: USER)

    addDashboardEntry(dashboardId: Int!, entryType: EntryType!, title: String!, total: Boolean!, stats: InputStatsSelection!, pos: InputResponsiveDashboardEntryPos): DashboardEntry @hasRole(role: USER)
    updateDashboardEntry(entryId: Int!, entryType: EntryType, title: String, total: Boolean, stats: InputStatsSelection, pos: InputResponsiveDashboardEntryPos): DashboardEntry @hasRole(role: USER)
    removeDashboardEntry(id: Int!): DashboardEntry! @hasRole(role: USER)

    setUserSettings(settings: InputUserSettings!): UserSettings! @hasRole(role: USER)
}

type RootQuery {
    suggestTag(query: String!): [TagDefinition!] @hasRole(role: USER)
    suggestTagValue(key: String!, query: String!): [String!] @hasRole(role: USER)
    tags: [TagDefinition!] @hasRole(role: USER)
    users: [User!] @hasRole(role: ADMIN)
    currentUser: User
    currentDevice: Device
    devices: [Device!] @hasRole(role: USER)
    timeSpans(fromInclusive: Time, toInclusive: Time, cursor: InputCursor): PagedTimeSpans! @hasRole(role: USER)
    # Tells for every row of an import if it can be imported, nothing is written.
    checkImport(rows: [InputImportRow!]!, createTags: [String!], updates: [InputImportUpdate!]): ImportResult! @hasRole(role: USER)
    timers: [TimeSpan!] @hasRole(role: USER)
    teamTimeSpans(fromInclusive: Time!, toInclusive: Time!, userId: Int): [TeamMemberTimeSpan!]! @hasRole(role: USER)
    teamMembers: [TeamMember!]! @hasRole(role: USER)
    teamStats(fromInclusive: Time!, toInclusive: Time!): TeamStats! @hasRole(role: USER)
    stats(ranges: [Range!], tags: [String!], excludeTags: [InputTimeSpanTag!], requireTags: [InputTimeSpanTag!]): [RangedStatisticsEntries!] @hasRole(role: USER)
    stats2(now: Time!, stats: InputStatsSelection!): [RangedStatisticsEntries!] @hasRole(role: USER)
    version: Version!
    dashboards: [Dashboard!] @hasRole(role: USER)
    userSettings: UserSettings!
}

input InputUserSettings {
    theme: Theme!
    dateLocale: DateLocale!
    firstDayOfTheWeek: WeekDay!
    dateTimeInputStyle: DateTimeInputStyle!
    # the tag which is preselected for new time spans, empty means the first tag
    defaultTag: String!
}

type UserSettings {
    theme: Theme!
    dateLocale: DateLocale!
    firstDayOfTheWeek: WeekDay!
    dateTimeInputStyle: DateTimeInputStyle!
    # the tag which is preselected for new time spans, empty means the first tag
    defaultTag: String!
}

enum WeekDay {
    Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday
}

enum Theme {
    GruvboxDark, GruvboxLight, MaterialDark, MaterialLight
}

enum DateLocale {
    Chinese, American, American24h, German, Australian, British
}

enum DateTimeInputStyle {
    Fancy, Native
}

input InputReplaceOptions {
    override: OverrideMode!
}

enum OverrideMode {
    Override, Discard
}

input InputCursor {
    offset: Int
    startId: Int
    pageSize: Int
}

type Cursor {
    hasMore: Boolean!
    offset: Int!
    startId: Int!
    pageSize: Int!
}

type Version {
    name: String!
    commit: String!
    buildDate: String!
}

type Login {
    token: String!
    user: User!
    device: Device!
}

type Device {
    id: Int!
    name: String!
    type: DeviceType!
    createdAt: Time!
    activeAt: Time!
}

enum DeviceType {
    LongExpiry, ShortExpiry, NoExpiry
}

scalar Time

type TagDefinition {
    color: String!
    key: String!
    user: User!
    usages: Int!
    # if the current user is allowed to change or remove the tag (only admins)
    editable: Boolean!
    # archived tags are not suggested and cannot be used for new time spans
    archived: Boolean!
}

type TagColor {
    key: String!
    color: String!
}

type User {
    admin: Boolean!
    id: Int!
    name: String!
}

type TimeSpan {
    id: Int!
    start: Time!
    end: Time
    oldStart: Time
    tags: [TimeSpanTag!]
    # TODO not nullable ^
    note: String!
}

# The part of a user which is visible to every other user.
type TeamMember {
    id: Int!
    name: String!
}

type TeamMemberTimeSpan {
    user: TeamMember!
    timeSpan: TimeSpan!
    # the colors of the tags of the time span: the color of the tag
    tagColors: [TagColor!]!
}

type TeamStatsDay {
    # Format: YYYY-MM-DD
    day: String!
    seconds: Float!
}

type TeamMemberStats {
    member: TeamMember!
    seconds: Float!
}

type TeamTagStats {
    key: String!
    value: String!
    seconds: Float!
    # The time of the members for this tag, the most first. Only members with time are contained.
    members: [TeamMemberStats!]!
}

type TeamStats {
    totalSeconds: Float!
    # The time per tag (a time span with several tags is counted for each of them), the most used first.
    tags: [TeamTagStats!]!
    days: [TeamStatsDay!]!
    # Contains every member, also those without any tracked time.
    members: [TeamMemberStats!]!
}

input InputImportRow {
    # The line in the file, it is returned with the result.
    line: Int!
    start: Time!
    end: Time!
    note: String!
    # The names of the tags.
    tags: [String!]!
}

# Replaces the work content and the tags of a time span which exists already (the time is not changed).
input InputImportUpdate {
    id: Int!
    note: String!
    tags: [String!]!
}

enum ImportStatus {
    # The row can be imported.
    Ok
    # A time span with the same time, work content and tags exists already (or is in the file twice).
    Duplicate
    # The time overlaps with another time span which is different.
    Conflict
    # The row uses tags which do not exist.
    MissingTags
    Error
}

enum ImportConflictSource {
    # A time span which exists already.
    Existing
    # An earlier row of the import.
    File
}

type ImportConflict {
    source: ImportConflictSource!
    # The id of the existing time span (source Existing).
    id: Int
    # The line of the earlier row (source File).
    line: Int
    start: Time!
    end: Time!
    note: String!
    tags: [String!]!
    # Start and end are the same, then the work content and the tags can be merged or replaced.
    sameTime: Boolean!
}

type ImportRowResult {
    line: Int!
    status: ImportStatus!
    message: String!
    # The tags of the row which do not exist (and are not created).
    missingTags: [String!]!
    conflict: ImportConflict
}

type ImportResult {
    rows: [ImportRowResult!]!
    # The amount of rows which are (or were) imported.
    imported: Int!
    # The amount of existing time spans which are (or were) updated.
    updated: Int!
    # All tags of the rows which do not exist and are not created.
    missingTags: [String!]!
}

type PagedTimeSpans {
    timeSpans: [TimeSpan!]!
    cursor: Cursor!
}

type TimeSpanTag {
    key: String!
    value: String!
}

input InputTimeSpanTag {
    key: String!
    value: String!
}

input StatInput {
    key: String!
    mustHave: [InputTimeSpanTag!]
    mustNotHave: [InputTimeSpanTag!]
}

input Range {
    start: Time!
    end: Time!
}

type StatisticsEntry {
    key: String!
    value: String!
    timeSpendInSeconds: Float!
}

type RangedStatisticsEntries {
    start: Time!
    end: Time!
    entries: [StatisticsEntry!]
}

type Dashboard {
    id: Int!
    name: String!,
    items: [DashboardEntry!]!
    ranges: [NamedDateRange!]!
}

type NamedDateRange {
    id: Int!
    name: String!
    editable: Boolean!
    range: RelativeOrStaticRange!
}

input InputNamedDateRange {
    name: String!
    editable: Boolean!
    range: InputRelativeOrStaticRange!
}

type StatsSelection {
    interval: StatsInterval!
    tags: [String!]
    excludeTags: [TimeSpanTag!]
    includeTags: [TimeSpanTag!]
    rangeId: Int
    range: RelativeOrStaticRange
}

input InputStatsSelection {
    interval: StatsInterval!
    tags: [String!]
    excludeTags: [InputTimeSpanTag!]
    includeTags: [InputTimeSpanTag!]
    rangeId: Int
    range: InputRelativeOrStaticRange
}

enum StatsInterval {
    Hourly, Daily, Weekly, Monthly, Yearly, Single
}

type RelativeOrStaticRange {
    from: String!
    to: String!
}

input InputRelativeOrStaticRange {
    from: String!
    to: String!
}

type DashboardEntry {
    id: Int!
    title: String!
    total: Boolean!
    statsSelection: StatsSelection!
    pos: ResponsiveDashboardEntryPos!
    entryType: EntryType!
}

type ResponsiveDashboardEntryPos {
    desktop: DashboardEntryPos!
    mobile: DashboardEntryPos!
}
input InputResponsiveDashboardEntryPos {
    desktop: InputDashboardEntryPos
    mobile: InputDashboardEntryPos
}

input InputDashboardEntryPos {
    w: Int!
    h: Int!
    x: Int!
    y: Int!
}

type DashboardEntryPos {
    w: Int!
    h: Int!
    x: Int!
    y: Int!
    minW: Int!
    minH: Int!
}

enum DashboardSize {
    Large,
    Medium,
    Small
}

enum EntryType {
    PieChart, BarChart, StackedBarChart, LineChart, VerticalTable, HorizontalTable
}
